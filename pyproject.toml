[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exaspim-neuron-reconstruction-agent"
version = "0.1.0"
description = "Enterprise-ready read-only operations agent scaffold for ExA-SPIM reconstruction programs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "typer>=0.12.3,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34.0,<2.0.0"]
smartsheet = ["smartsheet-python-sdk>=3.0.2,<4.0.0"]
llm = ["openai>=1.40.0,<2.0.0"]
dev = ["httpx>=0.27.0,<1.0.0", "pytest>=8.2.0,<9.0.0"]

[project.scripts]
exaspim-agent = "exaspim_agent.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
